<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metronomo">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Metronomo</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --accent:#ff9f0a; --dim:#3a3a3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font-family:-apple-system, system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: calc(env(safe-area-inset-top) + 64px) 20px calc(env(safe-area-inset-bottom) + 24px);
    user-select:none; -webkit-user-select:none;
  }
  /* margin:auto centra la vista, ma se è più alta dello schermo si può scorrere senza tagliare l'inizio */
  .view { display:flex; flex-direction:column; align-items:center; gap:24px; width:100%; margin:auto 0; }
  .hidden { display:none !important; }
  #bpm { font-size:96px; font-weight:200; font-variant-numeric:tabular-nums; line-height:1; text-align:center; }
  #bpmLabel { opacity:.6; letter-spacing:.2em; font-size:14px; text-align:center; }
  .row { display:flex; align-items:center; gap:16px; width:100%; max-width:380px; }
  input[type=range] { flex:1; accent-color:var(--accent); height:40px; }
  button.round {
    width:52px; height:52px; border-radius:50%; border:0; background:var(--dim);
    color:var(--fg); font-size:28px;
  }
  button.round:active { background:#555; }
  #beats { display:flex; gap:12px; height:24px; }
  .dot { width:24px; height:24px; border-radius:50%; background:var(--dim); transition:background .05s; }
  .dot.on { background:var(--accent); }
  .dot.accent.on { background:#fff; }

  /* Metronomo visivo: una pallina che oscilla come l'asta di un metronomo
     e tocca i bordi esattamente sul battito */
  #pend { position:relative; width:100%; max-width:340px; height:44px; }
  #pend::before { content:''; position:absolute; left:22px; right:22px; top:21px; height:2px; background:var(--dim); }
  #pend .end { position:absolute; top:8px; width:4px; height:28px; border-radius:2px; background:var(--dim); }
  #pend .end.l { left:20px; } #pend .end.r { right:20px; }
  #ball {
    position:absolute; top:4px; left:0; width:36px; height:36px; border-radius:50%;
    background:var(--accent); opacity:.55; will-change:transform;
  }
  #ball.flash { opacity:1; box-shadow:0 0 24px var(--accent); }
  #ball.flash.accent { background:#fff; box-shadow:0 0 28px #fff; }

  #play {
    width:130px; height:130px; border-radius:50%; border:0;
    background:var(--accent); color:#000; font-size:22px; font-weight:600;
  }
  #play.running { background:#ff453a; color:#fff; }
  select { background:var(--dim); color:var(--fg); border:0; border-radius:10px; padding:10px 14px; font-size:17px; }
  #tabs { display:flex; gap:8px; position:absolute; top:calc(env(safe-area-inset-top) + 12px); }
  #tabs button { background:var(--dim); color:var(--fg); border:0; border-radius:20px; padding:8px 14px; font-size:15px; }
  #tabs button.active { background:var(--accent); color:#000; }
  #tap { background:var(--dim); color:var(--fg); border:0; border-radius:12px; padding:12px 24px; font-size:17px; touch-action:manipulation; }
  .toggle { border:0; border-radius:20px; padding:10px 18px; font-size:16px; background:var(--dim); color:#999; }
  .toggle.on { background:#2c2c2e; color:var(--fg); box-shadow:inset 0 0 0 2px var(--accent); }

  #note { font-size:110px; font-weight:200; line-height:1; }
  #freq, #cents { opacity:.6; font-size:16px; text-align:center; }
  #meter { position:relative; width:100%; max-width:340px; height:44px; background:var(--dim); border-radius:22px; overflow:hidden; }
  #center { position:absolute; left:50%; top:0; bottom:0; width:2px; background:#888; }
  #needle { position:absolute; left:50%; top:4px; bottom:4px; width:8px; margin-left:-4px; border-radius:4px; background:var(--accent); transition:left .08s, background .1s; }
  #needle.ok { background:#30d158; }
  #strings { display:flex; gap:10px; }
  .str { width:44px; height:44px; border-radius:50%; background:var(--dim); display:flex; align-items:center; justify-content:center; font-weight:600; }
  .str.near { background:var(--accent); color:#000; }
  #mic { width:200px; height:64px; border-radius:32px; border:0; background:var(--accent); color:#000; font-size:17px; font-weight:600; }
  #mic.running { background:#ff453a; color:#fff; }

  #trkPanel { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; padding-top:8px; border-top:1px solid #2c2c2e; }
  #trkStatus { text-align:center; opacity:.8; font-size:15px; min-height:20px; max-width:340px; }
  #trkDev { font-size:56px; font-weight:200; line-height:1; font-variant-numeric:tabular-nums; }
  #trkDev.good { color:#30d158; }
  #trkStats { white-space:pre-line; text-align:center; opacity:.7; font-size:15px; min-height:44px; }
  #trkChart { width:100%; max-width:340px; aspect-ratio:340/150; height:auto; background:#1c1c1e; border-radius:12px; }
  #trkReset { border:0; border-radius:12px; padding:10px 20px; font-size:16px; background:var(--dim); color:var(--fg); }
  .level { width:100%; max-width:340px; height:8px; background:var(--dim); border-radius:4px; overflow:hidden; }
  .level > div { height:100%; width:0; background:#30d158; transition:width .08s; }
  .lbl { opacity:.6; font-size:14px; width:120px; }
</style>
</head>
<body>
  <div id="tabs">
    <button id="tabMetro" class="active">Metronomo</button>
    <button id="tabTuner">Accordatore</button>
  </div>

  <div class="view" id="metroView">
    <div>
      <div id="bpm">120</div>
      <div id="bpmLabel">BPM</div>
    </div>

    <div class="row">
      <button class="round" id="minus">−</button>
      <input type="range" id="slider" min="30" max="250" value="120">
      <button class="round" id="plus">+</button>
    </div>

    <div class="row" style="justify-content:center">
      <label>Tempo <select id="sig"></select></label>
      <button id="tap">TAP</button>
    </div>

    <div id="pend"><div class="end l"></div><div class="end r"></div><div id="ball"></div></div>
    <div id="beats"></div>

    <div class="row" style="justify-content:center">
      <button id="soundBtn" class="toggle on">🔊 Suono</button>
      <button id="trkBtn" class="toggle">🎤 Tracker</button>
    </div>

    <button id="play">START</button>

    <div id="trkPanel" class="hidden">
      <div id="trkStatus"></div>
      <div class="level" title="Livello del microfono"><div id="trkLevel"></div></div>
      <div id="trkDev">–</div>
      <canvas id="trkChart"></canvas>
      <div id="trkStats"></div>
      <div class="row">
        <span class="lbl">Sensibilità</span>
        <input type="range" id="trkSens" min="1" max="10" value="5">
      </div>
      <div class="row">
        <span class="lbl">Finestra <span id="trkWinVal">30%</span></span>
        <input type="range" id="trkWin" min="10" max="50" step="5" value="30">
      </div>
      <button id="trkReset">AZZERA STATISTICHE</button>
    </div>
  </div>

  <div class="view hidden" id="tunerView">
    <div id="note">–</div>
    <div id="freq">premi ATTIVA e suona una corda</div>
    <div id="meter">
      <div id="center"></div>
      <div id="needle"></div>
    </div>
    <div id="cents">0 cent</div>
    <div id="strings"></div>
    <div class="level" title="Livello del microfono"><div id="tunLevel"></div></div>
    <button id="mic">ATTIVA MICROFONO</button>
  </div>

<script>
/* ---------------------------------------------------------------
   METRONOMO - spiegazione didattica

   Problema: setInterval/setTimeout in JavaScript NON sono precisi
   (possono slittare di decine di ms), quindi il metronomo "balla".

   Soluzione classica ("A Tale of Two Clocks", Chris Wilson):
   - L'orologio dell'audio (AudioContext.currentTime) è preciso.
   - Un timer JS impreciso gira spesso (ogni 25 ms) e guarda un po'
     in avanti (100 ms): tutti i click che cadono in quella finestra
     vengono PROGRAMMATI sull'orologio audio con un tempo esatto.
   - Gli stessi tempi esatti servono alla grafica (pallini e pendolo)
     e al tracker, che confronta le tue pennate con questi battiti.
--------------------------------------------------------------- */

let ctx = null;            // AudioContext (si crea al primo tocco: regola iOS)
let bpm = 120;
let beatsPerBar = 4;
let running = false;
let soundOn = true;        // false = metronomo solo visivo (silenzioso)
let nextNoteTime = 0;      // quando suonerà il prossimo battito (tempo audio)
let nextK = 0;             // numero progressivo del prossimo battito
let currentBeat = 0;       // 0..beatsPerBar-1
let timerId = null;
let wakeLock = null;
const LOOKAHEAD_MS = 25;       // ogni quanto gira lo scheduler
const SCHEDULE_AHEAD_S = 0.1;  // quanto avanti programmiamo
const visualQueue = [];        // {beat, k, time} per sincronizzare la grafica
const beatLog = [];            // ultimi battiti programmati {k, time}: la griglia del tracker
let lastBeat = null;           // ultimo battito mostrato (per il pendolo)

const $ = id => document.getElementById(id);

// --- Suono: un breve "bip" generato con un oscillatore ---------------
function playClick(time, accent) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = accent ? 1500 : 1000;   // primo battito più acuto
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05); // decadimento rapido
  osc.connect(gain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.06);
}

// --- Scheduler -------------------------------------------------------
function scheduler() {
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD_S) {
    const accent = currentBeat === 0;
    if (soundOn) playClick(nextNoteTime, accent);
    visualQueue.push({ beat: currentBeat, k: nextK, time: nextNoteTime });
    beatLog.push({ k: nextK, time: nextNoteTime });
    if (beatLog.length > 16) beatLog.shift();
    nextNoteTime += 60 / bpm;                       // durata di un battito
    nextK++;
    currentBeat = (currentBeat + 1) % beatsPerBar;
  }
}

// --- Grafica: si aggiorna ad ogni frame ------------------------------
function draw() {
  if (!running) return;
  const now = ctx.currentTime;
  while (visualQueue.length && visualQueue[0].time <= now) {
    lastBeat = visualQueue.shift();
    highlight(lastBeat.beat);
  }
  drawPendulum(now);
  requestAnimationFrame(draw);
}
function highlight(beat) {
  [...$('beats').children].forEach((d, i) => d.classList.toggle('on', i === beat));
}
// Pendolo: in un battito la pallina va da un bordo all'altro con il moto
// di un pendolo (lenta ai bordi, veloce al centro) e tocca il bordo SUL
// battito. Così vedi arrivare il battito e puoi anticiparlo, invece di
// reagire a un lampo.
function drawPendulum(now) {
  const ball = $('ball'), W = $('pend').clientWidth - ball.offsetWidth;
  let x = 0, flash = false, accent = false;
  if (lastBeat) {
    const f = Math.min(1, Math.max(0, (now - lastBeat.time) / (60 / bpm)));
    const p = (1 - Math.cos(Math.PI * f)) / 2;
    x = lastBeat.k % 2 ? 1 - p : p;
    flash = now - lastBeat.time < 0.1;
    accent = lastBeat.beat === 0;
  }
  ball.style.transform = 'translateX(' + (x * W).toFixed(1) + 'px)';
  ball.classList.toggle('flash', flash);
  ball.classList.toggle('accent', flash && accent);
}

// --- Start / Stop ----------------------------------------------------
async function start() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();                // iOS: serve un gesto dell'utente
  running = true;
  $('play').textContent = 'STOP';
  $('play').classList.add('running');
  if (trkOn) await startTracker();   // il microfono usa lo stesso orologio del metronomo
  if (!running) return;              // fermato mentre si apriva il microfono
  currentBeat = 0;
  nextNoteTime = ctx.currentTime + 0.05;
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  requestAnimationFrame(draw);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
function stop() {
  running = false;
  clearInterval(timerId);
  visualQueue.length = 0;
  lastBeat = null;
  highlight(-1);
  drawPendulum(0);
  stopTracker();
  $('play').textContent = 'START';
  $('play').classList.remove('running');
  wakeLock?.release(); wakeLock = null;
}

// --- Interfaccia -----------------------------------------------------
function setBpm(v) {
  bpm = Math.max(30, Math.min(250, Math.round(v)));
  $('bpm').textContent = bpm;
  $('slider').value = bpm;
  drawChart();
}
function buildBeats() {
  $('beats').innerHTML = '';
  for (let i = 0; i < beatsPerBar; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' accent' : '');
    $('beats').appendChild(d);
  }
}
['2/4','3/4','4/4','5/4','6/8'].forEach(s => {
  const o = document.createElement('option');
  o.value = parseInt(s); o.textContent = s;
  if (s === '4/4') o.selected = true;
  $('sig').appendChild(o);
});
$('sig').onchange = e => { beatsPerBar = +e.target.value; currentBeat = 0; buildBeats(); };
$('slider').oninput = e => setBpm(+e.target.value);
$('minus').onclick = () => setBpm(bpm - 1);
$('plus').onclick  = () => setBpm(bpm + 1);
$('play').onclick  = () => running ? stop() : start();

// TAP tempo: media degli ultimi intervalli tra i tocchi
let taps = [];
$('tap').onclick = () => {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  taps = taps.slice(-6);
  if (taps.length > 1) {
    const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    setBpm(60000 / avg);
  }
};

function setSound(on) {
  soundOn = on;
  $('soundBtn').classList.toggle('on', on);
  $('soundBtn').textContent = on ? '🔊 Suono' : '🔇 Muto';
  trkHint();
}
$('soundBtn').onclick = () => setSound(!soundOn);

// Se la pagina torna visibile, riprende il wake lock
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible') {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
});

/* ---------------------------------------------------------------
   ACCORDATORE - spiegazione didattica

   1. Il microfono (getUserMedia) dà un flusso audio; un AnalyserNode
      ci fornisce gli ultimi campioni dell'onda.
   2. AUTOCORRELAZIONE: confrontiamo l'onda con se stessa spostata di
      "lag" campioni. Quando lag = periodo della nota, l'onda si
      sovrappone a se stessa e la correlazione è massima.
      frequenza = sampleRate / lag
   3. Dalla frequenza si ricava la nota: semitoni = 12 * log2(f/440)
      e i "cent" (centesimi di semitono) dicono quanto siamo stonati.
--------------------------------------------------------------- */
const GUITAR = [['E2',82.41],['A2',110],['D3',146.83],['G3',196],['B3',246.94],['E4',329.63]];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let micStream = null, analyser = null, tunerCtx = null, tunerRunning = false, frame = 0;
// Riferimenti ai nodi audio: se nessuna variabile li tiene, il browser può
// eliminarli (garbage collection) dopo pochi secondi e il microfono "si spegne".
let tunerSrc = null, trkSrc = null, trkAn = null;
const buf = new Float32Array(2048);

GUITAR.forEach(([n]) => {
  const d = document.createElement('div');
  d.className = 'str'; d.textContent = n[0]; d.dataset.n = n;
  $('strings').appendChild(d);
});

// Restituisce la frequenza stimata (Hz) oppure -1 se non c'è un suono chiaro
function detectPitch(x, sr) {
  const N = x.length;
  let rms = 0;
  for (let i = 0; i < N; i++) rms += x[i] * x[i];
  if (Math.sqrt(rms / N) < 0.002) return -1;           // troppo silenzio (il controllo nsdf sotto scarta il rumore)
  const minLag = Math.floor(sr / 500), maxLag = Math.floor(sr / 60);
  const half = N - maxLag;                              // finestra di confronto
  const nsdf = new Float32Array(maxLag + 1);
  for (let lag = minLag; lag <= maxLag; lag++) {
    let r = 0, m = 0;
    for (let i = 0; i < half; i++) {
      r += x[i] * x[i + lag];
      m += x[i] * x[i] + x[i + lag] * x[i + lag];
    }
    nsdf[lag] = m ? 2 * r / m : 0;                      // normalizzata: -1..1
  }
  // primo picco "alto" (evita gli errori di ottava)
  let max = 0;
  for (let l = minLag; l <= maxLag; l++) if (nsdf[l] > max) max = nsdf[l];
  if (max < 0.8) return -1;
  let lag = -1;
  for (let l = minLag + 1; l < maxLag; l++) {
    if (nsdf[l] > 0.9 * max && nsdf[l] >= nsdf[l - 1] && nsdf[l] >= nsdf[l + 1]) { lag = l; break; }
  }
  if (lag < 0) return -1;
  // interpolazione parabolica per precisione sotto il campione
  const a = nsdf[lag - 1], b = nsdf[lag], c = nsdf[lag + 1];
  const shift = (a - c) / (2 * (a - 2 * b + c) || 1);
  return sr / (lag + shift);
}

function tunerLoop() {
  if (!tunerRunning) return;
  if (frame++ % 2 === 0) {                              // ~30 analisi/s
    analyser.getFloatTimeDomainData(buf);
    const f = detectPitch(buf, tunerCtx.sampleRate);
    if (f > 0) showPitch(f);
  }
  requestAnimationFrame(tunerLoop);
}

function showPitch(f) {
  const midi = Math.round(69 + 12 * Math.log2(f / 440));
  const exact = 440 * Math.pow(2, (midi - 69) / 12);
  const cents = 1200 * Math.log2(f / exact);
  $('note').textContent = NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  $('freq').textContent = f.toFixed(1) + ' Hz';
  $('cents').textContent = (cents > 0 ? '+' : '') + cents.toFixed(0) + ' cent';
  const pos = 50 + Math.max(-50, Math.min(50, cents)) * 0.9;  // -50..+50 cent
  $('needle').style.left = pos + '%';
  $('needle').classList.toggle('ok', Math.abs(cents) < 5);
  // evidenzia la corda più vicina
  let best = null, bd = 1e9;
  GUITAR.forEach(([n, hz]) => { const d = Math.abs(1200 * Math.log2(f / hz)); if (d < bd) { bd = d; best = n; } });
  document.querySelectorAll('.str').forEach(s => s.classList.toggle('near', s.dataset.n === best && bd < 300));
}

// --- Microfono: apertura con messaggi d'errore chiari + barra di livello ---
async function openMic(statusEl) {
  if (!navigator.mediaDevices?.getUserMedia) {
    statusEl.textContent = 'Microfono non disponibile: apri la pagina da https:// o da localhost';
    return null;
  }
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    statusEl.textContent =
      e.name === 'NotAllowedError' ? 'Permesso microfono negato: consentilo dall\'icona nella barra degli indirizzi' :
      e.name === 'NotFoundError'   ? 'Nessun microfono trovato' :
      e.name === 'NotReadableError' ? 'Il microfono è occupato da un\'altra app' :
      'Errore microfono: ' + e.name;
    return null;
  }
}
// Aggiorna una barra con il livello (dB) letto da un AnalyserNode; restituisce l'id del timer
function startLevel(an, barId) {
  const b = new Float32Array(an.fftSize);
  return setInterval(() => {
    an.getFloatTimeDomainData(b);
    let s = 0; for (let i = 0; i < b.length; i++) s += b[i] * b[i];
    const db = 20 * Math.log10(Math.sqrt(s / b.length) + 1e-9);      // -60 dB = vuoto, 0 dB = pieno
    $(barId).style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%';
  }, 80);
}
let tunLevelTimer = null;

async function startTuner() {
  micStream = await openMic($('freq'));
  if (!micStream) return;
  tunerCtx = new (window.AudioContext || window.webkitAudioContext)();
  await tunerCtx.resume();
  analyser = tunerCtx.createAnalyser();
  analyser.fftSize = 2048;
  tunerSrc = tunerCtx.createMediaStreamSource(micStream);
  tunerSrc.connect(analyser);
  // L'analyser deve arrivare all'uscita (in silenzio), altrimenti alcuni browser smettono di elaborarlo
  const tunMute = tunerCtx.createGain(); tunMute.gain.value = 0;
  analyser.connect(tunMute).connect(tunerCtx.destination);
  tunLevelTimer = startLevel(analyser, 'tunLevel');
  $('freq').textContent = 'suona una corda';
  tunerRunning = true;
  $('mic').textContent = 'STOP'; $('mic').classList.add('running');
  tunerLoop();
}
function stopTuner() {
  tunerRunning = false;
  clearInterval(tunLevelTimer); $('tunLevel').style.width = '0';
  micStream?.getTracks().forEach(t => t.stop());
  tunerCtx?.close(); tunerCtx = null; micStream = null; tunerSrc = null;
  $('mic').textContent = 'ATTIVA MICROFONO'; $('mic').classList.remove('running');
}
$('mic').onclick = () => tunerRunning ? stopTuner() : startTuner();

/* ---------------------------------------------------------------
   TRACKER (dentro il metronomo) - spiegazione didattica

   1. La GRIGLIA è quella del metronomo: i battiti programmati dallo
      scheduler hanno un tempo esatto sull'orologio audio. Il tempo lo
      scegli con slider o TAP; puoi tenere il metronomo muto e seguire
      solo il pendolo.
   2. Un AudioWorklet (codice che gira sul thread audio, quindi con
      tempi precisi) ascolta il microfono sullo STESSO AudioContext e
      segnala gli ATTACCHI (le pennate).
   3. Ogni colpo viene assegnato al battito più vicino:
           d = t_colpo - t_battito      (+ = in ritardo, - = in anticipo)
      Si tengono solo i colpi entro la "Finestra" (±30% di battito di
      default) e uno solo per battito; gli altri (suddivisioni, rumori)
      vengono contati come ignorati.
   4. BATTITI VUOTI: se un battito passa senza colpi validi (pausa) lo
      registriamo con errore 0, così una pausa non conta come errore.
      Si comincia a contare dal primo colpo valido.
   5. LATENZA: il suono arriva al worklet in ritardo (latenza di ingresso
      del microfono); se il browser la dichiara la sottraiamo. Con il
      click acceso il battito lo senti in ritardo della latenza di uscita,
      e anche quella viene compensata.
--------------------------------------------------------------- */
/* Rilevatore di ATTACCHI (pennate), non di "suono forte":
   - Ogni blocco (128 campioni, ~3 ms) misura l'energia del segnale derivato:
     la derivata esalta il "clic" della plettrata, ricco di alte frequenze.
   - env = inviluppo di picco: segue subito le salite e scende piano
     (si dimezza in ~40 ms). Una nota che sfuma non supera mai il proprio
     inviluppo, quindi il fading out NON genera colpi.
   - Colpo = l'energia attuale supera di "ratio" volte l'inviluppo di ~8 ms
     prima: un salto improvviso, che c'è anche se l'accordo precedente
     sta ancora suonando.
   - Dopo un colpo, 90 ms di pausa per non contare due volte la stessa pennata. */
const ONSET_WORKLET = `
class OnsetProc extends AudioWorkletProcessor {
  constructor() {
    super();
    this.prev = 0; this.last = -1; this.min = 0.002; this.ratio = 4;
    this.env = 0; this.hist = new Float32Array(3);   // inviluppo degli ultimi 3 blocchi
    this.decay = Math.pow(0.5, 128 / sampleRate / 0.04);
    this.port.onmessage = e => { this.min = e.data.min; this.ratio = e.data.ratio; };
  }
  process(inputs) {
    const x = inputs[0][0];
    if (!x) return true;
    let s = 0, p = this.prev;
    for (let i = 0; i < x.length; i++) { const d = x[i] - p; p = x[i]; s += d * d; }
    this.prev = p;
    const e = s / x.length;                           // energia del blocco
    const ref = this.hist[0];                         // inviluppo di ~8 ms fa
    if (e > this.min * this.min && e > this.ratio * ref && currentTime - this.last > 0.09) {
      this.last = currentTime;
      this.port.postMessage(currentTime);
    }
    this.env = Math.max(e, this.env * this.decay);
    this.hist.copyWithin(0, 1); this.hist[2] = this.env;
    return true;
  }
}
registerProcessor('onset', OnsetProc);`;

let trkOn = false;              // tracker attivato con il pulsante 🎤
let WINDOW = 0.3;               // frazione di battito entro cui un colpo è "atteso" (slider Finestra)
let trkStream = null, trkNode = null, trkMute = null, workletCtx = null;
let trkLevelTimer = null;
let trkTimer = null;            // controlla periodicamente i battiti rimasti vuoti
let micLatency = 0;             // latenza di ingresso dichiarata dal browser (s)
let trk = { pts: [], ignored: 0, missed: 0, lastK: -1, started: false };

function trkHint() {
  if (!trkOn) return;
  $('trkStatus').textContent = soundOn
    ? 'Click acceso: usa le cuffie, altrimenti il microfono sente il click'
    : running ? 'Suona seguendo il pendolo' : 'Premi START e suona seguendo il pendolo';
}

function trkResetStats() {
  trk = { pts: [], ignored: 0, missed: 0, lastK: -1, started: false };
  $('trkDev').textContent = '–';
  $('trkDev').className = '';
  $('trkStats').textContent = '';
  drawChart();
}

$('trkBtn').onclick = () => {
  trkOn = !trkOn;
  $('trkBtn').classList.toggle('on', trkOn);
  $('trkPanel').classList.toggle('hidden', !trkOn);
  if (trkOn) {
    setSound(false);                 // di default silenzioso: il click disturberebbe il microfono
    if (running) startTracker();
  } else {
    stopTracker();
  }
  trkHint();
  drawChart();
};

// Il battito "teorico" per un colpo: dai battiti già programmati più quelli
// che arriveranno (un colpo in anticipo può precedere la programmazione).
function nearestBeat(t) {
  const T = 60 / bpm;
  const cands = [...beatLog, { k: nextK, time: nextNoteTime }, { k: nextK + 1, time: nextNoteTime + T }];
  let best = cands[0];
  for (const c of cands) if (Math.abs(t - c.time) < Math.abs(t - best.time)) best = c;
  return best;
}
// Con il click acceso il battito si SENTE dopo la latenza di uscita
const heardOffset = () => soundOn ? (ctx.outputLatency || ctx.baseLatency || 0) : 0;

// Battiti VUOTI: chiude i battiti passati da più della finestra senza colpi
function closeMisses(now) {
  if (!trk.started) return false;
  const W = WINDOW * 60 / bpm, off = heardOffset();
  let changed = false;
  for (const b of beatLog) {
    if (b.k > trk.lastK && b.time + off + W < now) {
      trk.pts.push({ k: b.k, d: 0, missed: true });
      trk.missed++; trk.lastK = b.k; changed = true;
    }
  }
  return changed;
}

function onOnset(tRaw) {
  if (!running || !trkOn) return;
  const t = tRaw - micLatency;
  closeMisses(t);
  const b = nearestBeat(t - heardOffset());
  const d = t - heardOffset() - b.time;
  if (b.k <= trk.lastK || Math.abs(d) > WINDOW * 60 / bpm) {   // battito già contato o fuori finestra
    if (trk.started) { trk.ignored++; trkUpdate(); }
    return;
  }
  trk.pts.push({ k: b.k, d: d * 1000 });
  trk.lastK = b.k;
  trk.started = true;
  trkUpdate();
}

function trkUpdate() {
  const P = trk.pts;
  if (P.length) {
    const last = P[P.length - 1];
    if (!last.missed) {
      $('trkDev').textContent = (last.d > 0 ? '+' : '') + last.d.toFixed(0) + ' ms';
      $('trkDev').className = Math.abs(last.d) < 25 ? 'good' : '';
    }
    const ds = P.map(p => p.d);
    const mean = ds.reduce((a, b) => a + b, 0) / ds.length;
    const sd = Math.sqrt(ds.reduce((a, b) => a + (b - mean) ** 2, 0) / ds.length);
    const trend = Math.abs(mean) < 10 ? 'in tempo' : mean > 0 ? 'tendi a ritardare' : 'tendi ad anticipare';
    $('trkStats').textContent = 'Colpi validi: ' + (P.length - trk.missed) + ' · vuoti: ' + trk.missed + ' · ignorati: ' + trk.ignored +
      '\nErrore medio: ' + mean.toFixed(0) + ' ms (' + trend + ') · Dev. std: ' + sd.toFixed(0) + ' ms';
  } else {
    $('trkStats').textContent = 'Colpi ignorati: ' + trk.ignored;
  }
  drawChart();
}

function drawChart() {
  const c = $('trkChart'), g = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1, W = 340, H = 150;
  if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  // bordi = la finestra del gate (±WINDOW di battito)
  const range = WINDOW * 60 / bpm * 1000;
  const y = ms => H / 2 - ms / range * (H / 2 - 8);
  g.lineWidth = 1;
  g.strokeStyle = '#555';
  g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();          // zero = in tempo
  g.setLineDash([4, 4]); g.strokeStyle = '#3a3a3c';
  [range, -range].forEach(v => { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(W, y(v)); g.stroke(); });
  g.setLineDash([]);
  g.fillStyle = '#888'; g.font = '11px sans-serif';
  g.fillText('tardi', 6, 14); g.fillText('presto', 6, H - 6);
  const P = trk.pts.slice(-40);
  if (!P.length) return;
  const step = (W - 20) / 39;
  const xs = P.map((_, i) => W - 10 - (P.length - 1 - i) * step);
  g.strokeStyle = '#ff9f0a'; g.lineWidth = 2; g.beginPath();
  P.forEach((p, i) => i ? g.lineTo(xs[i], y(p.d)) : g.moveTo(xs[i], y(p.d)));
  g.stroke();
  P.forEach((p, i) => {
    g.beginPath(); g.arc(xs[i], y(p.d), 4, 0, 7);
    if (p.missed) { g.strokeStyle = '#888'; g.lineWidth = 1.5; g.stroke(); }   // battito vuoto: cerchio vuoto grigio
    else { g.fillStyle = Math.abs(p.d) < 25 ? '#30d158' : '#ff9f0a'; g.fill(); }
  });
}

// Soglia assoluta sul segnale DERIVATO (che attenua molto le basse frequenze):
// scala logaritmica da 0.005 (sens 1) a ~0.00005 (sens 10).
// La sensibilità regola anche quanto deve essere brusco il salto di energia
// (ratio: da 8x con sens 1 a 2x con sens 10; 4.7x a metà).
function setSens() {
  const s = +$('trkSens').value;
  trkNode?.port.postMessage({
    min: 0.005 * Math.pow(10, -(s - 1) / 4.5),
    ratio: 8 * Math.pow(0.25, (s - 1) / 9)
  });
}
$('trkSens').oninput = setSens;
$('trkWin').oninput = () => {
  WINDOW = +$('trkWin').value / 100;
  $('trkWinVal').textContent = $('trkWin').value + '%';
  drawChart();
};

async function startTracker() {
  if (trkStream) return;
  const stream = await openMic($('trkStatus'));
  if (!stream) return;
  if (!running || !trkOn) { stream.getTracks().forEach(t => t.stop()); return; }  // annullato nel frattempo
  trkStream = stream;
  try {
    if (workletCtx !== ctx) {        // il modulo va caricato una volta per AudioContext
      const url = URL.createObjectURL(new Blob([ONSET_WORKLET], { type: 'application/javascript' }));
      await ctx.audioWorklet.addModule(url);
      workletCtx = ctx;
    }
  } catch (e) {
    stopTracker();
    $('trkStatus').textContent = 'Questo browser non supporta AudioWorklet';
    return;
  }
  micLatency = trkStream.getAudioTracks()[0].getSettings().latency || 0;
  trkNode = new AudioWorkletNode(ctx, 'onset', { numberOfOutputs: 1, outputChannelCount: [1] });
  trkNode.port.onmessage = e => onOnset(e.data);
  setSens();
  trkMute = ctx.createGain(); trkMute.gain.value = 0;   // i nodi devono arrivare all'uscita, ma in silenzio
  trkSrc = ctx.createMediaStreamSource(trkStream);
  trkSrc.connect(trkNode);
  trkAn = ctx.createAnalyser(); trkAn.fftSize = 2048;
  trkSrc.connect(trkAn);
  trkAn.connect(trkMute);
  trkNode.connect(trkMute).connect(ctx.destination);
  trkLevelTimer = startLevel(trkAn, 'trkLevel');
  // Ogni 50 ms controlla i battiti passati senza colpi (80 ms di grazia per il ritardo dei messaggi)
  trkTimer = setInterval(() => {
    if (running && trkStream && closeMisses(ctx.currentTime - micLatency - 0.08)) trkUpdate();
  }, 50);
  trkResetStats();
  trkHint();
}
function stopTracker() {
  clearInterval(trkTimer);
  clearInterval(trkLevelTimer); $('trkLevel').style.width = '0';
  trkStream?.getTracks().forEach(t => t.stop());
  trkSrc?.disconnect(); trkNode?.disconnect(); trkAn?.disconnect(); trkMute?.disconnect();
  trkStream = trkNode = trkSrc = trkAn = trkMute = null;
  trkHint();
}
$('trkReset').onclick = trkResetStats;

// --- Schede ----------------------------------------------------------
const TABS = { metro: 'metroView', tuner: 'tunerView' };
function showTab(name) {
  stop(); stopTuner();                     // mai metronomo e accordatore insieme
  for (const [n, view] of Object.entries(TABS)) {
    $(view).classList.toggle('hidden', n !== name);
  }
  $('tabMetro').classList.toggle('active', name === 'metro');
  $('tabTuner').classList.toggle('active', name === 'tuner');
}
$('tabMetro').onclick = () => showTab('metro');
$('tabTuner').onclick = () => showTab('tuner');

buildBeats();
drawPendulum(0);
drawChart();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
